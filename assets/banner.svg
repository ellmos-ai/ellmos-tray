<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <style>
      .font-sans {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'Cascadia Code', Consolas, Monaco, monospace;
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Ambient Glow Radials -->
    <radialGradient id="glow-p" cx="170" cy="140" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-s" cx="550" cy="160" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Glassmorphic Elements -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" />

  <!-- Technical Coordinate Grid Overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="170" cy="140" r="200" fill="url(#glow-p)" />
  <circle cx="550" cy="160" r="220" fill="url(#glow-s)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="5" height="300" fill="#818cf8" />

  <!-- Left Domain Graphic Motif (x=40..310, y=30..270) -->
  
    <!-- Ellmos Tray: Cross-Platform System Tray & Quick Control Popup -->
    <g transform="translate(45, 35)">
      <!-- Desktop Taskbar / Menu Bar Section -->
      <rect x="25" y="32" width="210" height="34" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" filter="url(#drop-shadow)"/>
      
      <!-- Brand Preset LED Chips -->
      <rect x="38" y="39" width="20" height="20" rx="4" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
      <text x="44" y="53" class="font-mono" font-size="10" font-weight="800" fill="#38bdf8">E</text>

      <rect x="64" y="39" width="20" height="20" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1"/>
      <text x="70" y="53" class="font-mono" font-size="10" font-weight="800" fill="#818cf8">B</text>

      <rect x="90" y="39" width="20" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
      <text x="96" y="53" class="font-mono" font-size="10" font-weight="800" fill="#34d399">O</text>

      <circle cx="218" cy="49" r="3" fill="#22c55e"/>
      <text x="180" y="53" class="font-mono" font-size="8.5" fill="#94a3b8">10:42</text>

      <!-- Floating Quick-Control Popover Window -->
      <g transform="translate(45, 75)">
        <rect width="170" height="100" rx="10" fill="#080c14" stroke="#38bdf8" stroke-width="1.8" filter="url(#drop-shadow)"/>
        <rect width="170" height="22" rx="10" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="12" y="15" class="font-mono" font-size="8" font-weight="700" fill="#38bdf8">QUICK CONTROL</text>

        <text x="12" y="40" class="font-mono" font-size="8" fill="#e2e8f0">Agent Daemon</text>
        <rect x="120" y="32" width="34" height="14" rx="7" fill="#10b981"/>
        <circle cx="146" cy="39" r="5" fill="#ffffff"/>

        <text x="12" y="60" class="font-mono" font-size="8" fill="#e2e8f0">Reflex Voice</text>
        <rect x="120" y="52" width="34" height="14" rx="7" fill="#334155"/>
        <circle cx="128" cy="59" r="5" fill="#94a3b8"/>

        <text x="12" y="82" class="font-mono" font-size="8" fill="#e2e8f0">System State</text>
        <rect x="115" y="74" width="44" height="14" rx="3" fill="#0284c7" fill-opacity="0.3"/>
        <text x="120" y="84" class="font-mono" font-size="7.5" font-weight="700" fill="#38bdf8">ONLINE</text>
      </g>

      <!-- Cross Platform Tag -->
      <g transform="translate(55, 185)">
        <text x="15" y="12" class="font-mono" font-size="8" font-weight="600" fill="#64748b">WIN · MACOS · LINUX</text>
      </g>
    </g>
    

  <!-- Vertical Divider Line -->
  <line x1="330" y1="35" x2="330" y2="265" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Right Branding & Meta Information (x=360..1160) -->
  <g transform="translate(360, 0)">
    <!-- Top Category Badge -->
    <g transform="translate(0, 48)">
      <rect width="280.0" height="24" rx="5" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-width="1"/>
      <text x="12" y="16" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#818cf8">ELLMOS-AI // DESKTOP // SYSTEM TRAY</text>
    </g>

    <!-- Repository Title -->
    <text x="0" y="122" class="font-sans" font-size="44" font-weight="800" letter-spacing="-1" fill="url(#title-grad)">ellmos-tray</text>

    <!-- English Subtitle / Tagline -->
    <text x="0" y="158" class="font-sans" font-size="17" font-weight="500" fill="#94a3b8">Pluggable Cross-Platform System Tray &amp; Quick-Control Client</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 214)">
      
        <g transform="translate(0, 0)">
          <rect width="174" height="30" rx="15" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
          <text x="87.0" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🖥️ Cross-Platform</text>
        </g>
        

        <g transform="translate(186, 0)">
          <rect width="188" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="94.0" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🔘 Pluggable Branding</text>
        </g>
        

        <g transform="translate(386, 0)">
          <rect width="151" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
          <text x="75.5" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">⚡ Quick Control</text>
        </g>
        

        <g transform="translate(549, 0)">
          <rect width="143" height="30" rx="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
          <text x="71.5" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🌊 Ocean &amp; BACH</text>
        </g>
        
    </g>
  </g>
</svg>